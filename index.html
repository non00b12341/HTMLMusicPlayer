<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Player</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <h1>Music Player</h1>
  <div class="layout">
    <section class="panel" aria-label="Player">
      <p class="now-label" id="status">Stopped</p>
      <p class="now-title" id="title">Pick a song</p>

      <div class="track" id="track" role="slider" tabindex="0" aria-label="Seek"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="fill" id="fill"></div>
      </div>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>

      <div class="row-btns">
        <button id="prev">Prev</button>
        <button id="play" class="dark">Play</button>
        <button id="next">Next</button>
      </div>
      <div class="row-btns">
        <button id="shuffle" class="wide" aria-pressed="false">Shuffle: off</button>
        <button id="loop" class="wide" aria-pressed="false">Loop: off</button>
      </div>

      <label class="vol">Volume
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
      </label>
    </section>

    <section class="panel" aria-label="Playlist">
      <div class="list-head"><h2>Playlist</h2></div>
      <ul id="playlist"></ul>
    </section>
  </div>
  <p class="hint">It plays music btw</p>
</main>

<script src="js/player.js" defer></script>
</body>
</html>
